<main class="formulario-caso">

<h1>Reportar un Caso</h1>

<p>

Complete el siguiente formulario con la mayor cantidad de información posible.

</p>

<form>


    <label>Nombre completo</label>

<input type="text">

<label>Edad</label>

<input type="number">

<label>Sexo</label>

<select>

<option>Masculino</option>

<option>Femenino</option>

<option>Otro</option>

</select>

<label>Fecha de desaparición</label>

<input type="date">

<label>Lugar de desaparición</label>

<input type="text">

<label>Descripción física</label>

<textarea rows="6"></textarea>

<label>Persona de contacto</label>

<input type="text">

<label>Teléfono</label>

<input type="tel">

<label>Correo electrónico</label>

<input type="email">

<button type="submit">

Enviar Reporte

</button>

</form>

</main>
